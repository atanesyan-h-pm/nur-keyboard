<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340">
<title>Step 1: paste the install command into Terminal and press Return</title>
<rect width="760" height="340" rx="16" fill="#F4EAD5"/>
<rect x="24" y="28" width="712" height="292" rx="12" fill="#000" opacity="0.10"/><rect x="24" y="24" width="712" height="292" rx="12" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><circle cx="44" cy="42" r="6" fill="#FF5F57"/><circle cx="64" cy="42" r="6" fill="#FEBC2E"/><circle cx="84" cy="42" r="6" fill="#28C840"/><text x="380.0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#6E6E73" text-anchor="middle">Terminal</text><rect x="25" y="56" width="710" height="1" rx="0" fill="#D2D2D7"/><text x="44" y="86" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="13" font-weight="400" fill="#6E6E73" text-anchor="start">~ %</text><text x="78" y="86" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12.5" font-weight="600" fill="#1D1D1F" text-anchor="start">curl -fsSL https://atanesyan-h-pm.github.io/nur-keyboard/install.sh | sh</text><text x="44" y="114" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">Downloading Nur from github.com/atanesyan-h-pm/nur-keyboard …</text><text x="44" y="134" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start"></text><text x="44" y="154" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1F7A3A" text-anchor="start">Nur is installed in ~/Library/Keyboard Layouts/Nur.bundle</text><text x="44" y="174" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start"></text><text x="44" y="194" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">Next:</text><text x="44" y="214" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">  1. Log out and log back in (Apple menu &gt; Log Out).</text><text x="44" y="234" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">  2. System Settings &gt; Keyboard &gt; Text Input &gt; Input Sources &gt; Edit… &gt; + &gt; Armenian,</text><text x="44" y="254" font-family="'SF Mono', Menlo, Monaco, monospace" font-size="12" font-weight="400" fill="#1D1D1F" text-anchor="start">     choose the AM Nur layouts and click Add.</text><rect x="70" y="68" width="648" height="28" rx="9" fill="none" stroke="#A3232F" stroke-width="3"/><circle cx="70" cy="68" r="12" fill="#A3232F"/><text x="70" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">1</text><rect x="470" y="280" width="250" height="26" rx="13" fill="#A3232F"/><text x="595" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F4EAD5" text-anchor="middle">Paste the line, press Return</text>
</svg>
