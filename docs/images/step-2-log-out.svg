 sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">System Settings…</text><text x="56" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">App Store</text><rect x="46" y="141" width="256" height="1" rx="0" fill="#D2D2D7"/><text x="56" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Recent Items</text><rect x="46" y="169" width="256" height="1" rx="0" fill="#D2D2D7"/><text x="56" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Force Quit…</text><rect x="46" y="197" width="256" height="1" rx="0" fill="#D2D2D7"/><text x="56" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Sleep</text><text x="56" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Restart…</text><text x="56" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Shut Down…</text><rect x="46" y="265" width="256" height="1" rx="0" fill="#D2D2D7"/><text x="56" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#1D1D1F" text-anchor="start">Lock Screen</text><rect x="42" y="287" width="264" height="22" rx="5" fill="#0A64D6"/><text x="56" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="start">Log Out…</text><text x="292" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#FFFFFF" text-anchor="end">⇧⌘Q</text><rect x="32" y="26" width="30" height="28" rx="9" fill="none" stroke="#A3232F" stroke-width="3"/><circle cx="32" cy="26" r="12" fill="#A3232F"/><text x="32" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">1</text><rect x="340" y="205" width="179.20000000000002" height="26" rx="13" fill="#A3232F"/><text x="429.6" y="223" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F4EAD5" text-anchor="middle">1  Click the Apple menu</text><rect x="38" y="283" width="272" height="30" rx="9" fill="none" stroke="#A3232F" stroke-width="3"/><circle cx="38" cy="283" r="12" fill="#A3232F"/><text x="38" y="288" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">2</text><rect x="340" y="274" width="300" height="26" rx="13" fill="#A3232F"/><text x="490" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#F4EAD5" text-anchor="middle">2  Log Out, then log back in</text><text x="340" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="start">macOS loads new keyboards</text><text x="340" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#1D1D1F" text-anchor="start">when you log in.</text><text x="340" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6E6E73" text-anchor="start">Restarting the Mac works too.</text>
