ont-weight="600" fill="#1D1D1F" text-anchor="start">Open System Settings, click Keyboard,</text><text x="266" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="start">then Edit… next to Input Sources, then +.</text>
