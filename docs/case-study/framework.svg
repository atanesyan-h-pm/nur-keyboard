<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
<title>Nur case study: the seven stages of the Product Design &amp; Improvement framework</title>
<rect width="760" height="480" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">Product Design &amp; Improvement framework — Nur</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">Seven stages, with the outcome of each stage for Nur</text>
<rect x="24" y="92" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="24" y="92" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="48" cy="124" r="12" fill="#A3232F"/><text x="48" y="128.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">1</text><text x="66" y="129" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Discover</text><line x1="38" y1="146" x2="174" y2="146" stroke="#D2D2D7"/><text x="38" y="170" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">macOS has 2 Armenian</text><text x="38" y="189" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">layouts; neither matches</text><text x="38" y="208" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">the Linux ones in use.</text><rect x="206" y="92" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="206" y="92" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="230" cy="124" r="12" fill="#A3232F"/><text x="230" y="128.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">2</text><text x="248" y="129" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Define</text><line x1="220" y1="146" x2="356" y2="146" stroke="#D2D2D7"/><text x="220" y="170" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Faithful port of all</text><text x="220" y="189" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Linux variants; easy</text><text x="220" y="208" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">install; open source.</text><rect x="388" y="92" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="388" y="92" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="412" cy="124" r="12" fill="#A3232F"/><text x="412" y="128.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">3</text><text x="430" y="129" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Ideate &amp; Decide</text><line x1="402" y1="146" x2="538" y2="146" stroke="#D2D2D7"/><text x="402" y="170" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Hand-made .keylayout,</text><text x="402" y="189" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">vendored upstream,</text><text x="402" y="208" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">6 layouts, name Nur.</text><rect x="570" y="92" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="570" y="92" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="594" cy="124" r="12" fill="#A3232F"/><text x="594" y="128.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">4</text><text x="612" y="129" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Design &amp; Build</text><line x1="584" y1="146" x2="720" y2="146" stroke="#D2D2D7"/><text x="584" y="170" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Nur.bundle, knot-grid</text><text x="584" y="189" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">pomegranate, AM/հյ</text><text x="584" y="208" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">names, curl | sh.</text><rect x="570" y="300" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="570" y="300" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="594" cy="332" r="12" fill="#A3232F"/><text x="594" y="336.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">5</text><text x="612" y="337" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Test &amp; Validate</text><line x1="584" y1="354" x2="720" y2="354" stroke="#D2D2D7"/><text x="584" y="378" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">DTD + lint; 1431 pairs</text><text x="584" y="397" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">offline, 1713 through</text><text x="584" y="416" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">macOS: 0 mismatches.</text><rect x="388" y="300" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="388" y="300" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="412" cy="332" r="12" fill="#A3232F"/><text x="412" y="336.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">6</text><text x="430" y="337" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Launch</text><line x1="402" y1="354" x2="538" y2="354" stroke="#D2D2D7"/><text x="402" y="378" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Public GitHub repo,</text><text x="402" y="397" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">installer on Pages,</text><text x="402" y="416" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">picture-based guide.</text><rect x="206" y="300" width="164" height="136" rx="10" fill="#FFFFFF" stroke="#A3232F" stroke-width="2"/><rect x="206" y="300" width="164" height="6" rx="3" fill="#D49A2E"/><circle cx="230" cy="332" r="12" fill="#A3232F"/><text x="230" y="336.68" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="middle">7</text><text x="248" y="337" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Measure &amp; Improve</text><line x1="220" y1="354" x2="356" y2="354" stroke="#D2D2D7"/><text x="220" y="378" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">6 real-use problems</text><text x="220" y="397" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">fixed; metrics and</text><text x="220" y="416" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">roadmap proposed.</text><line x1="190" y1="160.0" x2="194.0" y2="160.0" stroke="#5B3A29" stroke-width="2"/><polygon points="203.0,160.0 194.0,165.0 194.0,155.0" fill="#5B3A29"/><line x1="372" y1="160.0" x2="376.0" y2="160.0" stroke="#5B3A29" stroke-width="2"/><polygon points="385.0,160.0 376.0,165.0 376.0,155.0" fill="#5B3A29"/><line x1="554" y1="160.0" x2="558.0" y2="160.0" stroke="#5B3A29" stroke-width="2"/><polygon points="567.0,160.0 558.0,165.0 558.0,155.0" fill="#5B3A29"/><line x1="652.0" y1="230" x2="652.0" y2="288.0" stroke="#5B3A29" stroke-width="2"/><polygon points="652.0,297.0 647.0,288.0 657.0,288.0" fill="#5B3A29"/><line x1="568" y1="368.0" x2="564.0" y2="368.0" stroke="#5B3A29" stroke-width="2"/><polygon points="555.0,368.0 564.0,363.0 564.0,373.0" fill="#5B3A29"/><line x1="386" y1="368.0" x2="382.0" y2="368.0" stroke="#5B3A29" stroke-width="2"/><polygon points="373.0,368.0 382.0,363.0 382.0,373.0" fill="#5B3A29"/><polyline points="204.0,368.0 106.0,368.0 106.0,240.0" fill="none" stroke="#A3232F" stroke-width="2"/><polygon points="106.0,231.0 111.0,240.0 101.0,240.0" fill="#A3232F"/><text x="116.0" y="274" font-size="12.5" font-weight="600" fill="#A3232F" text-anchor="start">feedback</text><text x="116.0" y="290" font-size="12.5" font-weight="600" fill="#A3232F" text-anchor="start">loops back</text><g transform="translate(42 386.0) scale(3)" shape-rendering="crispEdges"><path fill="#F4EAD5" d="M3 1h10v1h-10zM3 2h1v1h-1zM5 2h2v1h-2zM9 2h2v1h-2zM12 2h1v1h-1zM3 3h1v1h-1zM6 3h1v1h-1zM9 3h1v1h-1zM12 3h1v1h-1zM3 4h2v1h-2zM11 4h2v1h-2zM3 5h3v1h-3zM10 5h3v1h-3zM2 6h2v1h-2zM12 6h2v1h-2zM1 7h2v1h-2zM13 7h2v1h-2zM1 8h1v1h-1zM7 8h2v1h-2zM14 8h1v1h-1zM1 9h1v1h-1zM6 9h1v1h-1zM9 9h1v1h-1zM14 9h1v1h-1zM1 10h1v1h-1zM5 10h1v1h-1zM10 10h1v1h-1zM14 10h1v1h-1zM1 11h1v1h-1zM6 11h1v1h-1zM9 11h1v1h-1zM14 11h1v1h-1zM1 12h1v1h-1zM7 12h2v1h-2zM14 12h1v1h-1zM1 13h2v1h-2zM13 13h2v1h-2zM2 14h2v1h-2zM12 14h2v1h-2zM3 15h10v1h-10z"/><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="98" y="404.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">proposed next:</text><text x="98" y="421.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">user interviews</text><text x="380.0" y="462" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="middle">Each box: the stage and Nur’s outcome in it. Stage 7 feeds what was learned back into Discover.</text>
