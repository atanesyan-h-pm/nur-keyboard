<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480">
<title>Nur releases v1.0.0, v1.1.0 and v1.1.1 with their contents, and the seven-step release order: commit, tag, release zip, checksum, pin, push main, verify live</title>
<rect width="760" height="480" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text xml:space="preserve" x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">Releases: what shipped, and how</text><text xml:space="preserve" x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">Three releases in two days, each published in the same verifiable order</text>
<rect x="24" y="84" width="228" height="188" rx="8" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/>
<rect x="38" y="96" width="70" height="22" rx="11" fill="#1E2747"/><text xml:space="preserve" x="73.0" y="111" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1.0.0</text>
<text xml:space="preserve" x="118" y="112" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Nov 25</text>
<text xml:space="preserve" x="38" y="140" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">Hardened first release</text>
<text xml:space="preserve" x="38" y="162" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• 6 layouts, key for key</text><text xml:space="preserve" x="38" y="178" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• validate.sh: NUL, control refs,</text><text xml:space="preserve" x="48" y="194" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">keyboardlayout ids</text><text xml:space="preserve" x="38" y="210" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• test-layouts.swift: every key</text><text xml:space="preserve" x="48" y="226" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">through macOS (1713 pairs)</text><text xml:space="preserve" x="38" y="242" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• installer pinned to a tag</text><text xml:space="preserve" x="48" y="258" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">+ SHA-256 check</text>
<line x1="252" y1="178" x2="262" y2="178" stroke="#5B3A29" stroke-width="2"/><polygon points="268,178 261,174 261,182" fill="#5B3A29"/>
<rect x="268" y="84" width="228" height="188" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1.5"/>
<rect x="282" y="96" width="70" height="22" rx="11" fill="#A3232F"/><text xml:space="preserve" x="317.0" y="111" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1.1.0</text>
<text xml:space="preserve" x="362" y="112" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Nov 25</text>
<text xml:space="preserve" x="282" y="140" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">UX pass</text>
<text xml:space="preserve" x="282" y="162" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• per-layout icons (seed colour,</text><text xml:space="preserve" x="292" y="178" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">stripe = Alt)</text><text xml:space="preserve" x="282" y="194" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• “Best for” + recommendation</text><text xml:space="preserve" x="282" y="210" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• Finder install (Nur.bundle.zip)</text><text xml:space="preserve" x="282" y="226" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• uninstall in the right order</text><text xml:space="preserve" x="282" y="242" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• --clear-cache, ghost note</text><text xml:space="preserve" x="282" y="258" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• package-release.sh</text>
<line x1="496" y1="178" x2="506" y2="178" stroke="#5B3A29" stroke-width="2"/><polygon points="512,178 505,174 505,182" fill="#5B3A29"/>
<rect x="512" y="84" width="228" height="188" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1.5"/>
<rect x="526" y="96" width="70" height="22" rx="11" fill="#1F7A3A"/><text xml:space="preserve" x="561.0" y="111" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">v1.1.1</text>
<text xml:space="preserve" x="606" y="112" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Nov 26</text>
<text xml:space="preserve" x="526" y="140" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">Fixes from release QA</text>
<text xml:space="preserve" x="526" y="162" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• D1: no stale zip in dist/</text><text xml:space="preserve" x="536" y="178" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">after a failed build</text><text xml:space="preserve" x="526" y="194" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• O1: upgrade note shows real</text><text xml:space="preserve" x="536" y="210" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">names (not \U0570…)</text><text xml:space="preserve" x="526" y="226" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• O2: svg2png names the</text><text xml:space="preserve" x="536" y="242" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">missing / read-only folder</text><text xml:space="preserve" x="526" y="258" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">• keys and icons unchanged</text>
<text xml:space="preserve" x="24" y="306" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">HOW EVERY RELEASE IS PUBLISHED (the live installer never points at a tag that doesn’t exist)</text>
<rect x="24.0" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="42.0" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="42.0" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text xml:space="preserve" x="34.0" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Commit</text>
<text xml:space="preserve" x="34.0" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">checks pass</text><text xml:space="preserve" x="34.0" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">(validate, test)</text>
<line x1="118.0" y1="368" x2="121.7" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="127.7,368 120.7,364 120.7,372" fill="#5B3A29"/>
<rect x="127.7" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="145.7" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="145.7" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text xml:space="preserve" x="137.7" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Tag</text>
<text xml:space="preserve" x="137.7" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">push the tag</text><text xml:space="preserve" x="137.7" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">only</text>
<line x1="221.7" y1="368" x2="225.4" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="231.4,368 224.4,364 224.4,372" fill="#5B3A29"/>
<rect x="231.3" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="249.3" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="249.3" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text xml:space="preserve" x="241.3" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Release</text>
<text xml:space="preserve" x="241.3" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">GitHub Release</text><text xml:space="preserve" x="241.3" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">+ zip attached</text>
<line x1="325.3" y1="368" x2="329.0" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="335.0,368 328.0,364 328.0,372" fill="#5B3A29"/>
<rect x="335.0" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="353.0" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="353.0" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text xml:space="preserve" x="345.0" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Checksum</text>
<text xml:space="preserve" x="345.0" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">tag tarball</text><text xml:space="preserve" x="345.0" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">SHA-256, twice</text>
<line x1="429.0" y1="368" x2="432.7" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="438.7,368 431.7,364 431.7,372" fill="#5B3A29"/>
<rect x="438.7" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="456.7" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="456.7" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text xml:space="preserve" x="448.7" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Pin</text>
<text xml:space="preserve" x="448.7" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">VERSION + SHA</text><text xml:space="preserve" x="448.7" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">in install.sh</text>
<line x1="532.7" y1="368" x2="536.4" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="542.4,368 535.4,364 535.4,372" fill="#5B3A29"/>
<rect x="542.4" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="560.4" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="560.4" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
<text xml:space="preserve" x="552.4" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Push main</text>
<text xml:space="preserve" x="552.4" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">Pages serves</text><text xml:space="preserve" x="552.4" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">the installer</text>
<line x1="636.4" y1="368" x2="640.1" y2="368" stroke="#5B3A29" stroke-width="2"/><polygon points="646.1,368 639.1,364 639.1,372" fill="#5B3A29"/>
<rect x="646.0" y="320" width="94" height="96" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/>
<circle cx="664.0" cy="338" r="10" fill="#A3232F"/><text xml:space="preserve" x="664.0" y="342" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">7</text>
<text xml:space="preserve" x="656.0" y="368" font-size="12" font-weight="700" fill="#1E2747" text-anchor="start">Verify</text>
<text xml:space="preserve" x="656.0" y="387" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">live install,</text><text xml:space="preserve" x="656.0" y="402" font-size="11" font-weight="400" fill="#5B3A29" text-anchor="start">zip, suite 7</text>
<text xml:space="preserve" x="24" y="444" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Users install with curl … | sh (Pages) or the release’s Nur.bundle.zip; both deliver the bundle from the tag.</text><text xml:space="preserve" x="24" y="460" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">A push to main alone never changes what users get.</text>
</g>
</svg>
