<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<title>Nur naming rounds: from script-inspired names to rug symbols, ending with Nur</title>
<rect width="760" height="400" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">Naming: three rounds to Nur</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">Each round was redirected by the author’s feedback</text>
<rect x="24" y="84" width="224" height="252" rx="12" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="38" y="110" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">Round 1 — the script</text><rect x="38" y="126" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="54" y="146" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Aybuben</text><rect x="38" y="166" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="54" y="186" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Mesrop</text><rect x="38" y="206" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="54" y="226" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Gir</text><rect x="38" y="246" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="54" y="266" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Tar Keys</text><text x="38" y="310" font-size="12.5" font-weight="600" fill="#A3232F" text-anchor="start">Feedback: draw on carpets / rugs</text><line x1="250" y1="210" x2="257.0" y2="210.0" stroke="#5B3A29" stroke-width="2"/><polygon points="266.0,210.0 257.0,215.0 257.0,205.0" fill="#5B3A29"/><rect x="268" y="84" width="224" height="252" rx="12" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="282" y="110" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">Round 2 — the rug</text><rect x="282" y="126" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="298" y="146" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Karpet</text><rect x="282" y="166" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="298" y="186" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Gorg</text><rect x="282" y="206" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="298" y="226" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Vishap</text><rect x="282" y="246" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="298" y="266" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Nakhsh</text><text x="282" y="310" font-size="12.5" font-weight="600" fill="#A3232F" text-anchor="start">Feedback: Armenian rug symbols</text><line x1="494" y1="210" x2="501.0" y2="210.0" stroke="#5B3A29" stroke-width="2"/><polygon points="510.0,210.0 501.0,215.0 501.0,205.0" fill="#5B3A29"/><rect x="512" y="84" width="224" height="252" rx="12" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="526" y="110" font-size="14" font-weight="700" fill="#1E2747" text-anchor="start">Round 3 — rug symbols</text><rect x="526" y="126" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="542" y="146" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Arev (arevakhach)</text><rect x="526" y="166" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="542" y="186" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Vishap</text><rect x="526" y="206" width="196" height="30" rx="15" fill="#A3232F" stroke="#A3232F" stroke-width="1"/><text x="542" y="226" font-size="13" font-weight="700" fill="#F4EAD5" text-anchor="start">Nur  ·  Նուռ</text><g transform="translate(688 209) scale(1.5)" shape-rendering="crispEdges"><path fill="#F4EAD5" d="M3 1h10v1h-10zM3 2h1v1h-1zM5 2h2v1h-2zM9 2h2v1h-2zM12 2h1v1h-1zM3 3h1v1h-1zM6 3h1v1h-1zM9 3h1v1h-1zM12 3h1v1h-1zM3 4h2v1h-2zM11 4h2v1h-2zM3 5h3v1h-3zM10 5h3v1h-3zM2 6h2v1h-2zM12 6h2v1h-2zM1 7h2v1h-2zM13 7h2v1h-2zM1 8h1v1h-1zM7 8h2v1h-2zM14 8h1v1h-1zM1 9h1v1h-1zM6 9h1v1h-1zM9 9h1v1h-1zM14 9h1v1h-1zM1 10h1v1h-1zM5 10h1v1h-1zM10 10h1v1h-1zM14 10h1v1h-1zM1 11h1v1h-1zM6 11h1v1h-1zM9 11h1v1h-1zM14 11h1v1h-1zM1 12h1v1h-1zM7 12h2v1h-2zM14 12h1v1h-1zM1 13h2v1h-2zM13 13h2v1h-2zM2 14h2v1h-2zM12 14h2v1h-2zM3 15h10v1h-10z"/><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><rect x="526" y="246" width="196" height="30" rx="15" fill="#F4EAD5" stroke="#D2D2D7" stroke-width="1"/><text x="542" y="266" font-size="13" font-weight="400" fill="#1E2747" text-anchor="start">Kenats (tree of life)</text><text x="526" y="310" font-size="12.5" font-weight="600" fill="#1F7A3A" text-anchor="start">Chosen: Nur</text><text x="24" y="362" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Constraint: no “Linux” in the product name. Nur (Նուռ) = pomegranate, a fertility symbol</text><text x="24" y="380" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">in rug borders; it became the icon (one square = one knot on a 16 × 16 grid).</text>
</g>
</svg>
