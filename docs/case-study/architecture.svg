<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" width="760" height="590">
<title>Nur architecture: from xkeyboard-config symbols/am to the macOS input menu</title>
<rect width="760" height="590" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">How Nur works</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">From the Linux source file to the macOS input menu, and how the bundle reaches users</text>
<rect x="16" y="84" width="728" height="150" rx="12" fill="#FFFFFF" fill-opacity="0.45" stroke="#D2D2D7" stroke-dasharray="4 4"/><text x="30" y="104" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">BUILD (by hand, in the repo)</text><rect x="16" y="266" width="728" height="120" rx="12" fill="#FFFFFF" fill-opacity="0.45" stroke="#D2D2D7" stroke-dasharray="4 4"/><text x="30" y="286" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">DISTRIBUTE</text><rect x="16" y="402" width="728" height="150" rx="12" fill="#FFFFFF" fill-opacity="0.45" stroke="#D2D2D7" stroke-dasharray="4 4"/><text x="30" y="422" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">ON THE USER’S MAC</text><rect x="32" y="112" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="44" y="134" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">symbols/am</text><text x="44" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">xkeyboard-config (Linux)</text><text x="44" y="170" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">8 variants, 2 levels</text><text x="44" y="186" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">vendored + commit hashes</text><text x="44" y="202" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start"></text><rect x="276" y="112" width="210" height="104" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="288" y="134" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">6 × .keylayout</text><text x="288" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">hand-made XML, 5 key maps:</text><text x="288" y="170" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">base · Shift · Caps Lock ·</text><text x="288" y="186" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Command (US) · Control</text><text x="288" y="202" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Option = base / Shift</text><rect x="530" y="112" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#A3232F" stroke-width="2"/><text x="542" y="134" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Nur.bundle</text><text x="542" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Info.plist: KLInfo per layout</text><text x="542" y="170" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">id …keyboardlayout.nur</text><text x="542" y="186" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">en / hy names (AM / հյ)</text><text x="542" y="202" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">.icns from icon.svg</text><line x1="234" y1="164" x2="265.0" y2="164.0" stroke="#5B3A29" stroke-width="2"/><polygon points="274.0,164.0 265.0,169.0 265.0,159.0" fill="#5B3A29"/><line x1="488" y1="164" x2="519.0" y2="164.0" stroke="#5B3A29" stroke-width="2"/><polygon points="528.0,164.0 519.0,169.0 519.0,159.0" fill="#5B3A29"/><text x="254" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="middle">port</text><text x="508" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="middle">pack</text><rect x="32" y="294" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="44" y="316" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">GitHub repo</text><text x="44" y="336" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">atanesyan-h-pm/nur-keyboard</text><text x="44" y="352" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">main branch, public</text><rect x="276" y="294" width="210" height="76" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="288" y="316" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">GitHub Pages</text><text x="288" y="336" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">serves install.sh from</text><text x="288" y="352" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">the main branch root</text><rect x="530" y="294" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="542" y="316" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">curl -fsSL … | sh</text><text x="542" y="336" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">downloads main tarball,</text><text x="542" y="352" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">copies Nur.bundle</text><line x1="234" y1="332" x2="265.0" y2="332.0" stroke="#5B3A29" stroke-width="2"/><polygon points="274.0,332.0 265.0,337.0 265.0,327.0" fill="#5B3A29"/><line x1="488" y1="332" x2="519.0" y2="332.0" stroke="#5B3A29" stroke-width="2"/><polygon points="528.0,332.0 519.0,337.0 519.0,327.0" fill="#5B3A29"/><polyline points="630.0,218.0 630.0,250.0 132.0,250.0 132.0,283.0" fill="none" stroke="#5B3A29" stroke-width="2"/><polygon points="132.0,292.0 127.0,283.0 137.0,283.0" fill="#5B3A29"/><rect x="306" y="240" width="148" height="20" fill="#F4EAD5"/><text x="380" y="254" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="middle">committed to the repo</text><rect x="530" y="430" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="542" y="452" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">~/Library/</text><text x="542" y="472" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Keyboard Layouts/Nur.bundle</text><text x="542" y="488" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">per user, no admin password</text><text x="542" y="504" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">--uninstall removes it</text><text x="542" y="520" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start"></text><rect x="276" y="430" width="210" height="104" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="288" y="452" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">macOS, at login</text><text x="288" y="472" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">reads KLInfo + key maps</text><text x="288" y="488" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">tags layouts as Armenian (hy)</text><text x="288" y="504" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">new or renamed layouts need</text><text x="288" y="520" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">a log out / in</text><rect x="32" y="430" width="200" height="104" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="44" y="452" font-size="13.5" font-weight="700" fill="#1E2747" text-anchor="start">Input Sources</text><text x="44" y="472" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Edit… › + › Armenian</text><text x="44" y="488" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">add AM Nur layouts</text><text x="44" y="504" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">switch: 🌐 key or menu</text><text x="44" y="520" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start"></text><line x1="630" y1="372" x2="630.0" y2="419.0" stroke="#5B3A29" stroke-width="2"/><polygon points="630.0,428.0 625.0,419.0 635.0,419.0" fill="#5B3A29"/><line x1="528" y1="482" x2="497.0" y2="482.0" stroke="#5B3A29" stroke-width="2"/><polygon points="488.0,482.0 497.0,477.0 497.0,487.0" fill="#5B3A29"/><line x1="274" y1="482" x2="243.0" y2="482.0" stroke="#5B3A29" stroke-width="2"/><polygon points="234.0,482.0 243.0,477.0 243.0,487.0" fill="#5B3A29"/><text x="640" y="399" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">install</text><text x="380.0" y="576" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="middle">Pure data (XML + plist + icons): no compiled code, so it runs on Apple Silicon and Intel without Rosetta or signing.</text>
</g>
</svg>
