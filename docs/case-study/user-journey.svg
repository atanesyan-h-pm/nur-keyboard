<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 798" width="760" height="798">
<title>Nur user journey: from wanting to type Armenian to typing, with the pain points found and their fixes</title>
<rect width="760" height="798" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">User journey and pain points</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">From “I want to type Armenian on my Mac” to typing — what broke in real use and how it was fixed</text>
<rect x="24" y="92.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="116.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Want</text><text x="38" y="136.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">“I want to type Armenian</text><text x="38" y="153.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">on my Mac”</text><rect x="236" y="101.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="101.0" width="6" height="54" rx="3" fill="#D49A2E"/><text x="252" y="123.0" font-size="12" font-weight="700" fill="#D49A2E" text-anchor="start">Problem</text><text x="308" y="123.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">macOS ships 2 Armenian layouts; neither matches the Linux ones</text><text x="252" y="143.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Answer</text><text x="308" y="143.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Nur ports all six distinct upstream variants (AM Nur …)</text><line x1="220" y1="128.0" x2="236" y2="128.0" stroke="#D2D2D7" stroke-width="2"/><rect x="24" y="190.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="214.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Install</text><text x="38" y="234.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Paste one line in Terminal:</text><text x="38" y="251.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">curl … | sh</text><rect x="236" y="199.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="199.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="207.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="221.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#6</text><text x="252" y="221.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="221.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">Early install meant git clone + a script: too technical</text><text x="252" y="241.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="241.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">One-line installer served from GitHub Pages; drawn step pictures</text><line x1="220" y1="226.0" x2="236" y2="226.0" stroke="#D2D2D7" stroke-width="2"/><rect x="24" y="310.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="334.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Log out / in</text><text x="38" y="354.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">macOS loads keyboard</text><text x="38" y="371.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">layouts only at login</text><rect x="236" y="288.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="288.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="296.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="310.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#1</text><text x="252" y="310.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="310.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">Layouts did not appear, even after a restart</text><text x="252" y="330.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="330.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Removed a NUL character (Ctrl+2); bundle id contains “keyboardlayout”</text><rect x="236" y="350.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="350.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="358.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="372.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#4</text><text x="252" y="372.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="372.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">After a rename the keyboard went inactive in the running session</text><text x="252" y="392.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="392.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Re-enabled the layouts; guide says changes need log out / in</text><line x1="220" y1="346.0" x2="236" y2="346.0" stroke="#D2D2D7" stroke-width="2"/><rect x="24" y="452.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="476.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Add</text><text x="38" y="496.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Input Sources › Edit… ›</text><text x="38" y="513.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">+ › Armenian</text><rect x="236" y="430.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="430.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="438.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="452.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#2</text><text x="252" y="452.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="452.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">Nur layouts were missing under Armenian in the + list</text><text x="252" y="472.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="472.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Option layer types Armenian, so macOS tags them “hy”; no auto-enable</text><rect x="236" y="492.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="492.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="500.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="514.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#5</text><text x="252" y="514.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="514.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">Warning: “The developer can access anything you type”</text><text x="252" y="534.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="534.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Explained: Nur is key tables only, no code; macOS always shows it</text><line x1="220" y1="488.0" x2="236" y2="488.0" stroke="#D2D2D7" stroke-width="2"/><rect x="24" y="572.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="596.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Switch</text><text x="38" y="616.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">🌐 key or the</text><text x="38" y="633.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">input menu</text><rect x="236" y="581.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="581.0" width="6" height="54" rx="3" fill="#A3232F"/><rect x="690" y="589.0" width="38" height="20" rx="10" fill="#A3232F"/><text x="709" y="603.0" font-size="12" font-weight="700" fill="#F4EAD5" text-anchor="middle">#3</text><text x="252" y="603.0" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">Pain</text><text x="308" y="603.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">Pomegranate icon unreadable in dark mode in the 🌐 switcher</text><text x="252" y="623.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Fix</text><text x="308" y="623.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Colour icon with a cream outline, readable on light and dark</text><line x1="220" y1="608.0" x2="236" y2="608.0" stroke="#D2D2D7" stroke-width="2"/><rect x="24" y="670.0" width="196" height="72" rx="12" fill="#FFFFFF" stroke="#1E2747" stroke-width="1.5"/><text x="38" y="694.0" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">Type</text><text x="38" y="714.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">Armenian letters; ⌘</text><text x="38" y="731.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">shortcuts stay US</text><rect x="236" y="679.0" width="500" height="54" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="236" y="679.0" width="6" height="54" rx="3" fill="#1F7A3A"/><text x="252" y="701.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Status</text><text x="308" y="701.0" font-size="12.5" font-weight="400" fill="#1E2747" text-anchor="start">No problem reported yet; typing after login is a manual check</text><text x="252" y="721.0" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">Verified</text><text x="308" y="721.0" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">1713 key/modifier pairs verified through macOS (0 mismatches)</text><line x1="220" y1="706.0" x2="236" y2="706.0" stroke="#D2D2D7" stroke-width="2"/><line x1="122" y1="165.0" x2="122.0" y2="180.0" stroke="#5B3A29" stroke-width="2"/><polygon points="122.0,189.0 117.0,180.0 127.0,180.0" fill="#5B3A29"/><line x1="122" y1="263.0" x2="122.0" y2="300.0" stroke="#5B3A29" stroke-width="2"/><polygon points="122.0,309.0 117.0,300.0 127.0,300.0" fill="#5B3A29"/><line x1="122" y1="383.0" x2="122.0" y2="442.0" stroke="#5B3A29" stroke-width="2"/><polygon points="122.0,451.0 117.0,442.0 127.0,442.0" fill="#5B3A29"/><line x1="122" y1="525.0" x2="122.0" y2="562.0" stroke="#5B3A29" stroke-width="2"/><polygon points="122.0,571.0 117.0,562.0 127.0,562.0" fill="#5B3A29"/><line x1="122" y1="645.0" x2="122.0" y2="660.0" stroke="#5B3A29" stroke-width="2"/><polygon points="122.0,669.0 117.0,660.0 127.0,660.0" fill="#5B3A29"/><text x="380.0" y="778" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="middle">#n = iteration number in the “Measure &amp; Improve” timeline (iterations.svg).</text>
</g>
</svg>
