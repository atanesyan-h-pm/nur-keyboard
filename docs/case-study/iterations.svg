<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 698" width="760" height="698">
<title>Nur iterations: six problems found in real use, their root causes and fixes</title>
<rect width="760" height="698" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">Iterations: problem → root cause → fix</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">What broke when the layouts met a real Mac, in the order it was found</text>
<line x1="46" y1="118" x2="46" y2="642" stroke="#D49A2E" stroke-width="4"/><text x="88" y="96" font-size="12" font-weight="700" fill="#A3232F" text-anchor="start">PROBLEM (REAL USE)</text><text x="310" y="96" font-size="12" font-weight="700" fill="#5B3A29" text-anchor="start">ROOT CAUSE</text><text x="532" y="96" font-size="12" font-weight="700" fill="#1F7A3A" text-anchor="start">FIX</text><rect x="76" y="108" width="204" height="90" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="108" width="204" height="90" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="108" width="216" height="90" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="130" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Layouts never appeared</text><text x="88" y="148" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Not in Input Sources,</text><text x="88" y="164" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">even after a restart</text><text x="310" y="130" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Ctrl+2 wrote &amp;#x0000; (NUL is</text><text x="310" y="146" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">illegal XML) → all 6 files</text><text x="310" y="162" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">dropped; id lacked</text><text x="310" y="178" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">“keyboardlayout”</text><text x="532" y="130" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Ctrl+2 types “2”; validator</text><text x="532" y="146" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">rejects NUL; bundle id</text><text x="532" y="162" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">am.nur.keyboardlayout.nur</text><line x1="281" y1="153.0" x2="287.0" y2="153.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,153.0 287.0,158.0 287.0,148.0" fill="#5B3A29"/><line x1="503" y1="153.0" x2="509.0" y2="153.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,153.0 509.0,158.0 509.0,148.0" fill="#5B3A29"/><circle cx="46" cy="153.0" r="14" fill="#A3232F"/><text x="46" y="158.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">1</text><rect x="76" y="210" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="210" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="210" width="216" height="76" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="232" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Missing under Armenian</text><text x="88" y="250" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Not in the + picker</text><text x="88" y="266" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">under Armenian</text><text x="310" y="232" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Auto-enabled sources are</text><text x="310" y="248" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">hidden from +; Latin Option</text><text x="310" y="264" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">layer → ~50 languages</text><text x="532" y="232" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Option types Armenian →</text><text x="532" y="248" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">language hy only; stop</text><text x="532" y="264" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">auto-enabling</text><line x1="281" y1="248.0" x2="287.0" y2="248.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,248.0 287.0,253.0 287.0,243.0" fill="#5B3A29"/><line x1="503" y1="248.0" x2="509.0" y2="248.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,248.0 509.0,253.0 509.0,243.0" fill="#5B3A29"/><circle cx="46" cy="248.0" r="14" fill="#A3232F"/><text x="46" y="253.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">2</text><rect x="76" y="298" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="298" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="298" width="216" height="76" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="320" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Icon unreadable in dark</text><text x="88" y="338" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Pomegranate invisible in</text><text x="88" y="354" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">the 🌐 switcher (dark)</text><text x="310" y="320" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Template-icon flag is not</text><text x="310" y="336" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">honoured in the 🌐 switcher</text><text x="532" y="320" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Colour icon with a cream</text><text x="532" y="336" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">outline: reads on light</text><text x="532" y="352" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">and dark</text><line x1="281" y1="336.0" x2="287.0" y2="336.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,336.0 287.0,341.0 287.0,331.0" fill="#5B3A29"/><line x1="503" y1="336.0" x2="509.0" y2="336.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,336.0 509.0,341.0 509.0,331.0" fill="#5B3A29"/><circle cx="46" cy="336.0" r="14" fill="#A3232F"/><text x="46" y="341.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">3</text><rect x="76" y="386" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="386" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="386" width="216" height="76" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="408" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Keyboard inactive after rename</text><text x="88" y="426" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Layouts stopped working</text><text x="88" y="442" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">in the running session</text><text x="310" y="408" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Session had the old names;</text><text x="310" y="424" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">new names load only</text><text x="310" y="440" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">at login</text><text x="532" y="408" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Re-enabled in saved input</text><text x="532" y="424" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">sources; documented</text><text x="532" y="440" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">log out / in</text><line x1="281" y1="424.0" x2="287.0" y2="424.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,424.0 287.0,429.0 287.0,419.0" fill="#5B3A29"/><line x1="503" y1="424.0" x2="509.0" y2="424.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,424.0 509.0,429.0 509.0,419.0" fill="#5B3A29"/><circle cx="46" cy="424.0" r="14" fill="#A3232F"/><text x="46" y="429.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">4</text><rect x="76" y="474" width="204" height="90" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="474" width="204" height="90" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="474" width="216" height="90" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="496" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">“Developer can access</text><text x="88" y="512" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">anything you type”</text><text x="88" y="530" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Privacy warning shown</text><text x="88" y="546" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">when adding Nur</text><text x="310" y="496" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">macOS shows it for every</text><text x="310" y="512" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">non-Apple input source</text><text x="532" y="496" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Explained: key tables only,</text><text x="532" y="512" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">no code; cannot be</text><text x="532" y="528" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">removed</text><line x1="281" y1="519.0" x2="287.0" y2="519.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,519.0 287.0,524.0 287.0,514.0" fill="#5B3A29"/><line x1="503" y1="519.0" x2="509.0" y2="519.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,519.0 509.0,524.0 509.0,514.0" fill="#5B3A29"/><circle cx="46" cy="519.0" r="14" fill="#A3232F"/><text x="46" y="524.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">5</text><rect x="76" y="576" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#A3232F" stroke-width="1"/><rect x="298" y="576" width="204" height="76" rx="8" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><rect x="520" y="576" width="216" height="76" rx="8" fill="#FFFFFF" stroke="#1F7A3A" stroke-width="1"/><text x="88" y="598" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Install too technical</text><text x="88" y="616" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">git clone + script is hard</text><text x="88" y="632" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">for non-technical users</text><text x="310" y="598" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">Install assumed developer</text><text x="310" y="614" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">tools and habits</text><text x="532" y="598" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">curl | sh on GitHub Pages</text><text x="532" y="614" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">+ drawn step pictures</text><text x="532" y="630" font-size="12" font-weight="400" fill="#1E2747" text-anchor="start">in the README</text><line x1="281" y1="614.0" x2="287.0" y2="614.0" stroke="#5B3A29" stroke-width="2"/><polygon points="296.0,614.0 287.0,619.0 287.0,609.0" fill="#5B3A29"/><line x1="503" y1="614.0" x2="509.0" y2="614.0" stroke="#5B3A29" stroke-width="2"/><polygon points="518.0,614.0 509.0,619.0 509.0,609.0" fill="#5B3A29"/><circle cx="46" cy="614.0" r="14" fill="#A3232F"/><text x="46" y="619.04" font-size="14" font-weight="700" fill="#F4EAD5" text-anchor="middle">6</text><text x="380.0" y="678" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="middle">In order of discovery. 1–4 needed changes to the bundle; 5 was answered with an explanation; 6 changed distribution.</text>
</g>
</svg>
