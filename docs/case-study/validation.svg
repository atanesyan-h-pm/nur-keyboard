<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 604" width="760" height="604">
<title>Nur validation levels: static checks, offline parse, macOS UCKeyTranslate, real use</title>
<rect width="760" height="604" rx="16" fill="#F4EAD5"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<g transform="translate(24 20) scale(2)" shape-rendering="crispEdges"><path fill="#A3232F" d="M6 5h4v1h-4zM4 6h8v1h-8zM3 7h10v1h-10zM2 8h5v1h-5zM9 8h5v1h-5zM2 9h4v1h-4zM10 9h4v1h-4zM2 10h3v1h-3zM11 10h3v1h-3zM2 11h4v1h-4zM10 11h4v1h-4zM2 12h5v1h-5zM9 12h5v1h-5zM3 13h10v1h-10zM4 14h8v1h-8z"/><path fill="#D49A2E" d="M4 2h1v1h-1zM7 2h2v1h-2zM11 2h1v1h-1zM4 3h2v1h-2zM7 3h2v1h-2zM10 3h2v1h-2zM5 4h6v1h-6zM7 9h2v1h-2zM6 10h4v1h-4zM7 11h2v1h-2z"/></g><text x="64" y="42" font-size="20" font-weight="700" fill="#1E2747" text-anchor="start">Validation: four levels, closer to the user each time</text><text x="64" y="62" font-size="13" font-weight="400" fill="#5B3A29" text-anchor="start">From XML rules to what macOS actually types</text>
<rect x="24" y="88" width="712" height="82" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="40" y="114" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">1  Static checks</text><text x="40" y="134" font-size="12" font-weight="400" fill="#A3232F" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">scripts/validate.sh</text><text x="40" y="154" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Apple KeyboardLayout DTD · NUL check · plist lint · unique ids · KLInfo per layout · id has “keyboardlayout”</text><rect x="540" y="102" width="182" height="24" rx="12" fill="#1F7A3A"/><text x="631.0" y="119" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">0 failures</text><line x1="380.0" y1="171" x2="380.0" y2="178.0" stroke="#5B3A29" stroke-width="2"/><polygon points="380.0,187.0 375.0,178.0 385.0,178.0" fill="#5B3A29"/><rect x="58" y="188" width="644" height="82" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="74" y="214" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">2  Offline parse vs worksheet</text><text x="74" y="234" font-size="12" font-weight="400" fill="#A3232F" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">each .keylayout vs docs/mapping-tables.md</text><text x="74" y="254" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">every key and modifier the XML defines, compared with the upstream-derived table</text><rect x="506" y="202" width="182" height="24" rx="12" fill="#1F7A3A"/><text x="597.0" y="219" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1431 pairs · 0 errors</text><line x1="380.0" y1="271" x2="380.0" y2="278.0" stroke="#5B3A29" stroke-width="2"/><polygon points="380.0,287.0 375.0,278.0 385.0,278.0" fill="#5B3A29"/><rect x="92" y="288" width="576" height="82" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="108" y="314" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">3  Through macOS itself</text><text x="108" y="334" font-size="12" font-weight="400" fill="#A3232F" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">TISRegisterInputSource + UCKeyTranslate</text><text x="108" y="354" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">6 layouts incl. Caps, Option, Shift+Option, Command</text><rect x="472" y="302" width="182" height="24" rx="12" fill="#1F7A3A"/><text x="563.0" y="319" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">1713 pairs · 0 mismatches</text><line x1="380.0" y1="371" x2="380.0" y2="378.0" stroke="#5B3A29" stroke-width="2"/><polygon points="380.0,387.0 375.0,378.0 385.0,378.0" fill="#5B3A29"/><rect x="126" y="388" width="508" height="82" rx="10" fill="#FFFFFF" stroke="#D49A2E" stroke-width="2" stroke-dasharray="6 4"/><text x="142" y="414" font-size="15" font-weight="700" fill="#1E2747" text-anchor="start">4  Real use on the Mac</text><text x="142" y="434" font-size="12" font-weight="400" fill="#A3232F" text-anchor="start" font-family="'SF Mono', Menlo, Monaco, monospace">after log out / in</text><text x="142" y="454" font-size="12" font-weight="400" fill="#5B3A29" text-anchor="start">Keyboard Viewer, TextEdit, ⌘ shortcuts</text><rect x="438" y="402" width="182" height="24" rx="12" fill="#D49A2E"/><text x="529.0" y="419" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">manual release checks</text><rect x="24" y="494" width="712" height="64" rx="10" fill="#FFFFFF" stroke="#D2D2D7" stroke-width="1"/><text x="40" y="518" font-size="13" font-weight="700" fill="#1E2747" text-anchor="start">Installer</text><text x="120" y="518" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">piped from the real GitHub Pages URL into a throwaway HOME: installs a bundle</text><text x="120" y="538" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="start">identical to the repo’s; --uninstall removes it.</text><text x="380.0" y="584" font-size="12.5" font-weight="400" fill="#5B3A29" text-anchor="middle">Each level is closer to what a user sees. Level 4 is not yet recorded as done; no usage data exists.</text>
</g>
</svg>
